<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create account — Ledger</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-brand">
    <div class="brand-mark">Ledger<span>.</span></div>
    <blockquote>
      Open an account in minutes.<br />No branch visit, no paperwork.
    </blockquote>
    <footer>&copy; 2026 Ledger Bank — demo application, not a real financial institution.</footer>
  </div>

  <div class="auth-form-wrap">
    <form class="auth-form" id="register-form" novalidate>
      <h1>Create your account</h1>
      <p class="lede">A checking account is opened automatically with a $0 balance.</p>

      <div class="field">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" name="fullName" autocomplete="name" required />
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required />
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="6" required />
      </div>

      <div class="form-note" id="form-note"></div>

      <button type="submit" class="btn-primary" id="submit-btn">Create account</button>

      <p class="auth-switch">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/register.js"></script>
</body>
</html>
